<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sin conexión — Metal Quiz</title>
	<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Oswald&display=swap" rel="stylesheet">
	<style>
		html, body { height: 100%; margin: 0; }
		body {
			display: flex; flex-direction: column; align-items: center; justify-content: center;
			background: radial-gradient(circle at 50% 30%, #1c0203 0%, #0a0a0a 60%);
			color: #e8e8e8; font-family: 'Oswald', sans-serif; text-align: center; padding: 2rem;
		}
		h1 { font-family: 'Metal Mania', cursive; color: #ff1f2d; font-size: clamp(2rem, 8vw, 3.5rem); text-shadow: 0 0 18px rgba(255,31,45,.4); margin: 0 0 .5rem; }
		p { color: #9a9a9a; max-width: 420px; line-height: 1.6; }
		button {
			margin-top: 1.5rem; padding: .8rem 2.2rem; border: 0; border-radius: 8px; cursor: pointer;
			background: linear-gradient(180deg, #ff1f2d, #c1121f); color: #fff; font-weight: 700;
			text-transform: uppercase; letter-spacing: 2px; font-size: 1rem;
			box-shadow: 0 6px 20px rgba(193,18,31,.5);
		}
	</style>
</head>
<body>
	<h1>Sin conexión</h1>
	<p>El Metal Quiz necesita internet para sonar (el audio viene de YouTube). Comprueba tu conexión y vuelve a la carga.</p>
	<button onclick="location.reload()">Reintentar</button>
	<p style="margin-top:2rem;font-size:1.4rem">\m/</p>
</body>
</html>
